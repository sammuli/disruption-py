# Standalone conda environment for reading DIII-D data over FDP with
# disruption-py. No pixi, and none of the FDP data-access stack.
#
#   mamba env create -f environment.yml     # or: conda env create -f ...
#   conda activate disruption-py-fdp
#
# This is the minimal set. Reading over FDP needs only the fdp:// MDSplus
# transport, because the origin evaluates everything server-side -- so there is
# no toksearch, no toksearch_d3d, no ptdata, no XRootD and no Pelican client
# library here. Authentication assumes a token file at ~/.fdp/token, so the
# pelican client is not installed either. See docs/usage/fdp.md.

name: disruption-py-fdp

channels:
  - conda-forge
  - ga-fdp

dependencies:
  - python=3.12          # disruption-py requires >=3.12,<3.14

  # The fdp:// MDSplus transport (libMdsIpFDP.so). Pulls stock conda-forge
  # MDSplus; that plus this one shared library is the whole data path.
  - mdsip-fdp

  # For tests/test_fdp_origin.py, the opt-in check that the origin is reachable.
  - pytest

  - pip
  - pip:
      # Swap for the upstream repo once this is merged, or use `pip install -e .`
      # if you have the repo checked out.
      - disruption-py @ git+https://github.com/sammuli/disruption-py@sammuli/fdp-origin-config

# For examples/fdp_disruption_plots.py only, add:  mamba install matplotlib
# (numpy/pandas/xarray/scipy/netCDF4 all arrive with disruption-py via pip.)
